<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donhumberto.com</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Bienvenido a Donhumberto.com</h1>
    </header>
    <aside class="sidebar">
        <div class="logo">
            <img class="imagen_logo"  src="./imagenes/logo_corralon.png">
            <h2>Corralón Don Humberto</h2>
        </div>
        <nav class="menu">
            <div>
                <a href="index.html"> <img class="imagen_sidebar" src="./imagenes/inicio.png"> Inicio</a>
                <a href="productos.html"> <img class="imagen_sidebar" src="./imagenes/caja.png"> Productos</a>
                <a href="ventas.html"> <img class="imagen_sidebar" src="./imagenes/carrito.png"> Ventas</a>
                <a href="compras.html"><img class="imagen_sidebar" src="./imagenes/carrito.png"> compras</a>
                <a href="logistica.html"> <img class="imagen_sidebar" src="./imagenes/camion.png"> Logística</a>
                <a href="facturacion.html" class="activo"><img class="imagen_sidebar" src="./imagenes/cuadernito.png">Facturaciones</a>
                <a href="#" onclick="abrirLogin(event)"><img class="imagen_sidebar" src="./imagenes/login.png" alt="">Iniciar sesión</a>
            </div>
        </nav>
    </aside>
    <section>
        <div class="galeria">
            <div class="contenido_galeria4">
                <h3>Detalles del Pedido</h3>
                <table class="excel-table2">
                    <tbody>
                        <tr>
                            <td>N° Pedido</td>
                            <td>2548</td>
                        </tr>
                        <tr>
                            <td>Cliente</td>
                            <td>Leandro Cuello</td>
                        </tr>
                        <tr>
                            <td>Fecha</td>
                            <td>04/11/26</td>
                        </tr>
                        <tr>
                            <td>Total</td>
                            <td>$325.000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="contenido_galeria4">
                <h3>Métodos de Pago</h3>
                <div>
                    <input type="checkbox" id="efectivo" name="pagos" value="efectivo" checked>
                    <label for="html">Efectivo</label>
                </div>
                <div>
                    <input type="checkbox" id="tarjeta" name="pagos" value="tarjeta" checked>
                    <label for="html">Tarjeta de Crédito</label>
                </div>
                <div>
                    <input type="checkbox" id="transferencia" name="pagos" value="transferencia" checked>
                    <label for="html">Transferencia Bancaria</label>
                </div>
                <div>
                    <input type="checkbox" id="html" name="pagos" value="cheque" checked>
                    <label for="html">Cheque</label>
                </div>
                <div>
                    <label for="comentarios">Comentarios o sugerencias:</label>
                    <textarea id="comentarios" name="usuario_comentarios" rows="4" cols="50"></textarea>
                </div>
                <div class="display-flex">
                    <button class="boton_gris">Cancelar</button>
                    <button class="boton_verde">Confirmar</button>
                </div>

            </div>
        </div>
    </section>
    <div id="ventana-login" class="fondo-login">
        <div class="contenido-login">

            <button class="cerrar-login" onclick="cerrarLogin()">×</button>

            <h2>Iniciar sesión</h2>

            <p>Ingresá tus datos para continuar</p>

            <form onsubmit="iniciarSesion(event)">

                <label for="usuario">Usuario o correo electrónico</label>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingresá tu usuario"
                    required
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingresá tu contraseña"
                    required
                >
                <button type="submit" class="boton-login">
                    Iniciar sesión
                </button>
            </form>
        </div>
    </div>
    <script>
        function abrirLogin(event) {
            event.preventDefault();

            document.getElementById("ventana-login").style.display = "flex";
        }

        function cerrarLogin() {
            document.getElementById("ventana-login").style.display = "none";
        }

        document.getElementById("ventana-login").addEventListener("click", function(event) {

            if (event.target === this) {
                cerrarLogin();
            }

        });

        function iniciarSesion(event) {
            event.preventDefault();

            alert("Formulario enviado correctamente.");

            cerrarLogin();
        }
    </script>
</body>
